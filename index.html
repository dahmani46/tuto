<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Transformation avec JavaScript</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 10px;
        background-color: aquamarine;
      }
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }
      .item {
        display: inline-block;
        width: 300px;
        height: 300px;
        background-color: lightblue;
        margin: 10px;
        transition: transform 300ms var(--ease-in-out);
        transition-delay: calc(var(--i) * 50ms);
        animation: item-enter 300ms var(--ease-out) backwards;
        animation-delay: calc(var(--i) * 50ms);
      }
      .items[data-moved] .item {
        transform: translateX(110%) scale(0.95);
        /* leading (rightmost) card leaves first so cards never overlap */
        transition-delay: calc((var(--n) - 1 - var(--i)) * 50ms);
      }
      @keyframes item-enter {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
      }
      .item img {
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid black;
        border-radius: 20px;
        transition: box-shadow 200ms ease;
      }
      #transformButton {
        margin-top: 700px;
        margin-left: 0;
        padding: 50px;
        border-color: blue;
        background-color: black;
        color: yellow;
        transition: transform 160ms var(--ease-out);
      }
      #transformButton:active {
        transform: scale(0.97);
      }
      @media (hover: hover) and (pointer: fine) {
        .item img:hover {
          box-shadow: inset 0 0 1em gold, 0 0 2em red;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .item {
          transition: opacity 200ms ease;
          animation-name: item-fade;
        }
        .items[data-moved] .item {
          transform: none;
          opacity: 0.5;
        }
        #transformButton:active {
          transform: none;
        }
      }
      @keyframes item-fade {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="items" style="--n: 3">
      <div class="item item1" style="--i: 0">
        <img
          src="https://images.unsplash.com/photo-1721679241840-05534f295cf1?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzOXx8fGVufDB8fHx8fA%3D%3D"
          alt=""
        />
      </div>
      <div class="item item2" style="--i: 1">
        <img
          src="https://images.unsplash.com/photo-1722082095699-b47e61479b4b?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw1M3x8fGVufDB8fHx8fA%3D%3D"
          alt=""
        />
      </div>
      <div class="item item3" style="--i: 2">
        <img
          src="https://images.unsplash.com/photo-1722077263690-aa29e77bdbed?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw1OXx8fGVufDB8fHx8fA%3D%3D"
          alt=""
        />
      </div>
    </div>
    <button id="transformButton">Translate Items</button>
    <script src="app.js"></script>
  </body>
</html>
